# Desktop installers for each OS (built on that OS) and a zip of the web app.
# A pushed v* tag, or a tag typed in when starting it by hand, also publishes a
# GitHub release with every file attached. Started by hand with no tag, it only
# builds. GitHub Pages is updated on every push by pages.yml, not here.
name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v0.2.0 (empty = build only)
        required: false
        default: ''
  push:
    tags: ['v*']

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  # Shown in the app's About tab; the web job falls back to the commit.
  VITE_APP_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: cargo test --locked -p someterm-native
      - name: Set release version
        run: |
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid release tag"; exit 1; }
            node -e 'require("fs").writeFileSync("apps/tauri/src-tauri/release-config.json", JSON.stringify({version: process.env.TAG.slice(1)}))'
          else
            echo '{}' > apps/tauri/src-tauri/release-config.json
          fi
      - run: pnpm --filter @someterm/desktop dist --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/release-config.json
      - uses: actions/upload-artifact@v7
        with:
          name: someterm-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "VITE_APP_VERSION=${VITE_APP_VERSION:-$(git rev-parse --short HEAD)}" >> "$GITHUB_ENV"
      - run: pnpm --filter @someterm/web build
      - name: Zip the web app
        run: |
          version=${TAG#v}
          [[ -n "$TAG" ]] || version=$(git rev-parse --short HEAD)
          mkdir -p out
          (cd apps/web/dist && zip -qr "$GITHUB_WORKSPACE/out/SomeTerm-web-$version.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: someterm-web
          path: out/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.tag != ''
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      # Creates the tag at the built commit when it does not exist yet.
      # Re-running for the same tag replaces the files instead of failing.
      - name: Publish the release
        run: |
          ls -l files
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            pre=; [[ "$TAG" == *-* ]] && pre=--prerelease
            gh release create "$TAG" --target "$GITHUB_SHA" --title "SomeTerm ${TAG#v}" --generate-notes $pre
          fi
          gh release upload "$TAG" files/* --clobber

