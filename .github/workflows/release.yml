# Desktop installers for each OS (built on that OS) and a zip of the web app.
# A pushed v* tag, or a tag typed in when starting it by hand, also publishes a
# GitHub release with every file attached. A release without a suffix (v1.2.3,
# not v1.2.3-rc.1) also puts the web app on GitHub Pages; ticking "pages" when
# starting by hand does that without a release. Started by hand with neither,
# it only builds. Ordinary pushes do not run it, so they use no Actions minutes.
name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v0.2.0 (empty = build only)
        required: false
        default: ''
      pages:
        description: Publish the web app to GitHub Pages
        type: boolean
        default: false
  push:
    tags: ['v*']

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  # Shown in the app's About tab; the web job falls back to the commit.
  VITE_APP_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PAGES: ${{ inputs.pages || (github.event_name == 'push' || inputs.tag != '') && !contains(github.event_name == 'push' && github.ref_name || inputs.tag, '-') }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # A release build carries the tag's version in the app and file names.
      - if: env.TAG != ''
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.1, got '$TAG'"; exit 1; }
          echo "EB_ARGS=-c.extraMetadata.version=${TAG#v}" >> "$GITHUB_ENV"
      - run: pnpm --filter @someterm/electron run build
      - run: pnpm exec electron-builder $EB_ARGS
        working-directory: apps/electron
        env:
          # Unsigned builds; signing needs certificates added as secrets later.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: someterm-${{ matrix.os }}
          path: |
            apps/electron/release/*.AppImage
            apps/electron/release/*.exe
            apps/electron/release/*.dmg
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "VITE_APP_VERSION=${VITE_APP_VERSION:-$(git rev-parse --short HEAD)}" >> "$GITHUB_ENV"
      - run: pnpm --filter @someterm/web build
      - if: env.PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Zip the web app
        run: |
          version=${TAG#v}
          [[ -n "$TAG" ]] || version=$(git rev-parse --short HEAD)
          mkdir -p out
          (cd apps/web/dist && zip -qr "$GITHUB_WORKSPACE/out/SomeTerm-web-$version.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: someterm-web
          path: out/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.tag != ''
    needs: [desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: someterm-*
          path: files
          merge-multiple: true
      # Creates the tag at the built commit when it does not exist yet.
      # Re-running for the same tag replaces the files instead of failing.
      - name: Publish the release
        run: |
          ls -l files
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            pre=; [[ "$TAG" == *-* ]] && pre=--prerelease
            gh release create "$TAG" --target "$GITHUB_SHA" --title "SomeTerm ${TAG#v}" --generate-notes $pre
          fi
          gh release upload "$TAG" files/* --clobber

  # Needs Settings → Pages → Source set to "GitHub Actions" once.
  pages:
    if: always() && needs.web.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (inputs.pages || (github.event_name == 'push' || inputs.tag != '') && !contains(github.event_name == 'push' && github.ref_name || inputs.tag, '-'))
    needs: [web, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
