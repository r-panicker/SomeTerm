# Puts the web app on GitHub Pages (https://r-panicker.github.io/SomeTerm/) on every push to main.
# Needs Settings → Pages → Source set to "GitHub Actions" once.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs, as in GitHub's Pages template: deploying in the
  # same job as the upload intermittently found no artifact yet.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shown in the About tab, so the page says which commit it is.
      - run: echo "VITE_APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - run: pnpm --filter @someterm/web build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
