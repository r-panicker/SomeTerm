[package]
name = "someterm"
version = "0.1.0"
description = "Serial, TCP and Telnet terminal with plotting, bridging, capture and replay"
authors = ["Rajesh Panicker"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
someterm-native = { path = "../../../packages/transport-native" }
