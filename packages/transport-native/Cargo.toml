[package]
name = "someterm-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
tokio-serial = "5"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Communication", "Win32_Foundation"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.26", features = ["term", "fs"] }
